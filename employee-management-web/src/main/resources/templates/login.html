<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexHR | Sign In to Enterprise Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body class="login-page-body">

<div class="login-card">
    <div style="position: absolute; top: 16px; right: 16px;">
        <button type="button" class="header-icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
            <span id="themeIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
        </button>
    </div>

    <div class="login-brand-wrap">
        <div class="login-brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        </div>
        <h1 class="login-title">NexHR Portal</h1>
        <p class="login-desc">Enterprise Employee Management System</p>
    </div>

    <!-- Error Alert Banner -->
    <div class="alert alert-danger" th:if="${error}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span th:text="${error}">Invalid username or password</span>
    </div>

    <!-- Login Form -->
    <form action="/login" method="post">
        <div class="form-group" style="margin-bottom: 18px;">
            <label class="form-label" for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Enter username (e.g. hr)"
                   required
                   autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label class="form-label" for="password">Password</label>
            </div>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="••••••••"
                   required
                   autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
            <span>Sign In to Dashboard</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </form>

    <!-- Quick Demo Credential Pills -->
    <div class="demo-credentials-box">
        <div class="demo-title">Quick Demo Login (Click to Auto-fill):</div>
        <div class="demo-pills">
            <button type="button" class="demo-pill" onclick="fillCredentials('hr', '1234')">
                <strong>HR Admin:</strong> hr / 1234
            </button>
            <button type="button" class="demo-pill" onclick="fillCredentials('manager', '1234')">
                <strong>Manager:</strong> manager / 1234
            </button>
            <button type="button" class="demo-pill" onclick="fillCredentials('employee', '1234')">
                <strong>Employee:</strong> employee / 1234
            </button>
        </div>
    </div>
</div>

<script>
    function fillCredentials(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }
</script>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
