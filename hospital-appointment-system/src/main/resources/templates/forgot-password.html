<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Reset Your Password')}"></head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

<nav th:replace="~{fragments/layout :: public_nav}"></nav>
<div th:replace="~{fragments/layout :: omni_search_modal}"></div>

<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 36px; box-shadow: var(--shadow-xl);">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="logo-icon" style="width: 44px; height: 44px; margin: 0 auto 12px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h2 style="font-size: 1.5rem; margin-bottom: 6px;">Forgot Password?</h2>
            <p style="font-size: 0.88rem;">Enter your verified email address to receive password recovery instructions.</p>
        </div>

        <form action="/forgot-password" method="post">
            <div class="form-group">
                <label class="form-label" for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" name="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 18px;">
                Send Reset Link
            </button>

            <div style="text-align: center; font-size: 0.88rem;">
                <a href="/login" style="color: var(--muted);">← Back to Sign In</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: public_footer}"></footer>

</body>
</html>
