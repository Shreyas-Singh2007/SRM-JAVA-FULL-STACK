<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Patient Registration')}"></head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

<nav th:replace="~{fragments/layout :: public_nav}"></nav>
<div th:replace="~{fragments/layout :: omni_search_modal}"></div>

<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div class="card" style="width: 100%; max-width: 540px; padding: 36px; box-shadow: var(--shadow-xl);">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="logo-icon" style="width: 48px; height: 48px; margin: 0 auto 14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            </div>
            <h2 style="font-size: 1.7rem; margin-bottom: 6px;">Patient Registration</h2>
            <p style="font-size: 0.9rem;">Create your personal health portal account to book appointments and track visits.</p>
        </div>

        <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}">
            Error message.
        </div>

        <form action="/register" method="post">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="gender">Gender</label>
                    <select id="gender" name="gender" class="form-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="bloodGroup">Blood Group</label>
                    <select id="bloodGroup" name="bloodGroup" class="form-select">
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-icon-wrapper">
                    <input type="password" id="regPassword" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                    <button type="button" class="password-toggle-btn" data-target="regPassword" title="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 0.82rem; color: var(--muted); cursor: pointer;">
                    <input type="checkbox" required style="width: auto; margin-top: 3px;">
                    <span>I consent to HIPAA privacy terms and agree to receive appointment alerts and clinic notifications.</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 20px;">
                Complete Registration
            </button>

            <div style="text-align: center; font-size: 0.9rem; color: var(--muted);">
                Already registered? 
                <a href="/login" style="color: var(--primary); font-weight: 600;">Sign In</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: public_footer}"></footer>

</body>
</html>
